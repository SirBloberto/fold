<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold</title>
<style>
    :root {
        --page: #0a0c14;
        --panel: #12151f;
        --raised: #181c29;
        --edge: #242a3b;
        --text: #eceae4;
        --dim: #8b90a1;
        --accent: #ffcf70;
        --wrong: #ff7a6b;
        --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
        color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
        :root {
            --page: #f5f2eb;
            --panel: #ffffff;
            --raised: #faf8f3;
            --edge: #e0d9cb;
            --text: #1b1d27;
            --dim: #6a6d7b;
            --accent: #a8680f;
            --wrong: #c0392b;
            color-scheme: light;
        }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        background: var(--page);
        color: var(--text);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow-x: hidden;
    }
    a { color: inherit; }
    .wrap { max-width: 1920px; margin: 0 auto; padding: 0 16px; }

    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 56px;
    }
    .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.02em; text-decoration: none; }
    .brand span { color: var(--accent); }
    .top nav { display: flex; gap: 20px; color: var(--dim); font-size: 14px; }
    .top nav a { text-decoration: none; }
    .top nav a:hover { color: var(--text); }

    #grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        padding: 4px 0 16px;
        margin: 0 auto;
    }
    @media (min-width: 640px) {
        #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1100px) {
        #grid {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            max-width: calc((100vh - 112px) / 4 * 16 / 9 * 5 + 30px);
        }
    }
    .card {
        position: relative;
        display: block;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
        overflow: hidden;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
    .frame { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .frame .play {
        position: absolute; right: 10px; top: 10px;
        background: rgb(0 0 0 / 0.5); color: #fff; border-radius: 999px;
        font-size: 12px; padding: 2px 10px; opacity: 0; transition: opacity 0.15s;
        font-variant-numeric: tabular-nums;
    }
    .card:hover .play { opacity: 1; }
    .words {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 28px 10px 7px;
        background: linear-gradient(rgb(0 0 0 / 0), rgb(0 0 0 / 0.85));
        color: #fff; pointer-events: none;
        text-shadow: 0 1px 3px rgb(0 0 0 / 0.9);
    }
    .words .name { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-size: 14px; }
    .words .name span { color: rgb(255 255 255 / 0.7); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
    .words p {
        margin: 0; color: rgb(255 255 255 / 0.85); font-size: 12px; line-height: 1.4;
        max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.2s, opacity 0.2s;
    }
    .card:hover .words p, .card:focus-visible .words p { max-height: 5em; opacity: 1; }

    body.editing { height: 100vh; overflow: hidden; }
    body.editing #home { display: none; }
    #editor { display: none; }
    body.editing #editor {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 16px;
        height: calc(100vh - 56px);
        padding-bottom: 16px;
    }
    #code {
        width: 100%; height: 100%; margin: 0; resize: none;
        background: var(--panel); color: var(--text);
        border: 1px solid var(--edge); border-radius: 12px;
        padding: 14px 16px;
        font: 13px/1.6 var(--mono);
        tab-size: 4; white-space: pre; overflow: auto;
        font-variant-ligatures: none;
    }
    #code:focus { outline: none; border-color: var(--accent); }
    #stage { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
    #box {
        width: 100%; position: relative;
        border-radius: 12px; border: 1px solid var(--edge); background: #000; overflow: hidden;
    }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; cursor: grab; touch-action: none; }
    #view.held { cursor: grabbing; }
    #stats { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
    #problem { color: var(--wrong); font: 13px/1.5 var(--mono); white-space: pre-wrap; }
    #problem:empty, #inputs:empty { display: none; }
    #inputs {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 20px;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px;
        max-height: 30vh; overflow: auto;
    }
    #inputs label {
        display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px; align-items: center; gap: 10px;
        font: 13px var(--mono);
    }
    #inputs input[type="range"] { width: 100%; accent-color: var(--accent); }
    #inputs input[type="color"] { width: 44px; height: 26px; border: 1px solid var(--edge); border-radius: 6px; background: none; padding: 0; }
    #inputs button {
        grid-column: 1 / -1; justify-self: start;
        font: 13px system-ui, sans-serif; color: var(--page); background: var(--accent);
        border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer;
    }
    #inputs output { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }

    @media (max-width: 860px) {
        body.editing { height: auto; overflow: auto; }
        body.editing #editor { grid-template-columns: minmax(0, 1fr); height: auto; }
        #stage { order: -1; }
        #box { flex: none; aspect-ratio: 16 / 9; }
        #code { height: 60vh; }
        #inputs { max-height: none; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header class="top">
        <a class="brand" href="#">fold<span>.</span></a>
        <nav id="nav"></nav>
    </header>

    <div id="home">
        <div id="grid"></div>
    </div>

    <main id="editor">
        <textarea id="code" spellcheck="false" autocapitalize="off" aria-label="Fold source"></textarea>
        <div id="stage">
            <div id="box"><canvas id="view"></canvas></div>
            <div id="stats"></div>
            <div id="problem" role="status"></div>
            <div id="inputs"></div>
        </div>
    </main>
</div>
<script type="module" src="gallery.js"></script>
</body>
</html>
